version: '3.8'

services:
  postgres:
    image: postgres
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chess-today
    ports:
      - 1234:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: